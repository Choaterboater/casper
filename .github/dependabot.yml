# Keeps the commit pins of Casper's own GitHub Actions and the app's packages current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Reads package.json and bun.lock. Exact pins stay exact: Dependabot bumps a pin to the new version, never to a range.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Casper pins Pi on purpose: moving to a new Pi is a decision (and the patch on pi-ai is redone by hand), so
      # Dependabot leaves these alone until the pin is moved in a PR of its own.
      - dependency-name: "@earendil-works/*"
      # Casper's own code uses the TypeScript compiler API and Node's path types in ways a new major breaks; those
      # majors are taken on purpose, not by a bot.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The engine packages move together, and pi-ai carries a patch (patches/) that must be redone on each bump.
      pi:
        patterns:
          - "@earendil-works/*"
      packages:
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/*"
