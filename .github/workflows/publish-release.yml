name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create; must match package.json (for example v0.2.22)
        required: true
# Nothing by default. The build job reads code and runs bun; only the publish job may write,
# and it runs no project code: it takes the checked build and creates the release.
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag names this commit's version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $RELEASE_TAG"; exit 1; }
          version="v$(jq -r .version package.json)"
          [ "$RELEASE_TAG" = "$version" ] || { echo "Tag $RELEASE_TAG does not match package.json $version"; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo "Release $RELEASE_TAG already exists"; exit 1; fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Stop unless the Linux, macOS and Windows previews passed on this commit
        run: |
          for workflow in linux-preview.yml macos-preview.yml windows-preview.yml; do
            conclusion="$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            [ "$conclusion" = success ] || { echo "$workflow has not passed on $GITHUB_SHA (last result: ${conclusion:-no run}). Run it on this commit first."; exit 1; }
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Build every release target
        run: bun run build:release -- --all
      - name: Verify the build
        run: |
          cd dist/release
          sha256sum -c SHA256SUMS
          ./casper-linux-x64 --version | grep -F "casper ${RELEASE_TAG#v} ("
          ls install.sh install.ps1 VERSION LICENSE THIRD_PARTY_NOTICES.txt
          # Personal build paths must not be embedded in the executables.
          ! grep -a -l -E "/home/runner/work|/Users/" casper-*
      - name: Release notes from docs/RELEASE.md
        run: |
          awk -v tag="$RELEASE_TAG" '
            index($0, "## " tag) == 1 { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' docs/RELEASE.md > notes.md
          [ -s notes.md ] || { echo "No docs/RELEASE.md section for $RELEASE_TAG"; exit 1; }
          ! grep -q "Not released yet" notes.md || { echo "docs/RELEASE.md still says $RELEASE_TAG is not released"; exit 1; }
          printf '\n## Install\n\nmacOS / Linux:\n```sh\ncurl -fsSL https://github.com/%s/releases/download/%s/install.sh | sh\n```\n\nWindows (PowerShell):\n```powershell\n[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; irm https://github.com/%s/releases/download/%s/install.ps1 | iex\n```\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> notes.md
          mv notes.md dist/release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/release/
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writes the release and signs where it was built; it runs no project code.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      # Build provenance over every file SHA256SUMS lists: the installers check it with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS
      - name: Check the files again, then publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist/release && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/release/* --prerelease --target "$GITHUB_SHA" \
            --title "Casper $RELEASE_TAG — preview" --notes-file dist/release-notes.md
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
