name: Deflake one test file
on:
  workflow_dispatch:
    inputs:
      file:
        description: One tests/*.test.ts file (inspect logs for skips)
        required: true
        type: string
      runs:
        description: Independent runs, 1 to 100
        required: true
        default: '10'
        type: number
      os:
        description: Runner OS
        required: true
        default: ubuntu-24.04
        type: choice
        options: [ubuntu-24.04, macos-15, windows-2025]
permissions:
  contents: read
jobs:
  deflake:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Linux fixture prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat ripgrep tmux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install macOS fixture prerequisites
        if: runner.os == 'macOS'
        run: brew install ripgrep tmux
      - name: Count independent passes and failures
        env:
          DEFLAKE_FILE: ${{ inputs.file }}
          DEFLAKE_RUNS: ${{ inputs.runs }}
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
        run: bun tools/deflake.ts
      - name: Keep every run and the counts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deflake-results
          path: ${{ runner.temp }}/deflake-results/
          if-no-files-found: warn
          retention-days: 14
