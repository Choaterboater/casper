name: Windows preview
# Pushes to main, the nightly run and manual runs test everything. A pull request runs the fast tier of the
# suite in six parts, and the heavy tier (real processes, ConPTY, the build and installers) too when it
# changes a path where OS behaviour matters (tools/test-tier.ts). Linux runs everything on every pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tools/**', 'tests/**', 'evals/**', 'docs/WINDOWS.md', 'docs/PLATFORM_VERIFICATION.md', 'package.json', 'bun.lock', 'tsconfig.json', 'bunfig.toml', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/windows-preview.yml']
  # Every PR gets a Windows run too, so a change that breaks Windows is seen before it merges.
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tools/**', 'tests/**', 'evals/**', 'docs/WINDOWS.md', 'docs/PLATFORM_VERIFICATION.md', 'package.json', 'bun.lock', 'tsconfig.json', 'bunfig.toml', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/windows-preview.yml']
permissions:
  contents: read
# A newer push to a pull request stops the older run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Whole suite, or only its fast tier: a pull request that changes no path where OS behaviour matters.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit: HEAD^1 is main, so the diff is the PR's own change.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Choose the tests (whole suite, or the fast tier on a pull request that leaves OS behaviour alone)
        id: tier
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then { git diff --no-renames --name-only HEAD^1 HEAD || true; } > "$RUNNER_TEMP/changed.txt"; else : > "$RUNNER_TEMP/changed.txt"; fi
          bun tools/test-tier.ts decide "$EVENT" < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/tier.txt"
          tier="$(head -n 1 "$RUNNER_TEMP/tier.txt")"
          case "$tier" in full | fast) ;; *) echo "test-tier.ts printed no tier"; exit 1 ;; esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          { echo "## Windows"; tail -n +2 "$RUNNER_TEMP/tier.txt"; } | tee -a "$GITHUB_STEP_SUMMARY"

  # The build, the real-console screen and both installers (heavy: whole-suite runs only). The suite runs
  # beside it in six parts, with source terminals in a separate serial job.
  standalone:
    needs: changes
    # Runs unless the tier is "fast": if the changes job itself failed, the whole suite runs, and no check is
    # skipped (a skipped job would count as passed for a required check).
    if: ${{ !cancelled() && needs.changes.outputs.tier != 'fast' }}
    runs-on: windows-latest
    # Normal job: 7.3 min p90 (standalone), 9.1 (suite part 1), of the last 40 successful runs. 20 is 2x p90 or more.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Turn off Defender's live scan for this run
        # Windows CI runners scan every file the tests create; that alone makes the suite much slower.
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, "$env:USERPROFILE\.bun" -ErrorAction Stop
            "Defender live scan off for this run"
          } catch { "Defender unchanged: $($_.Exception.Message)" }
      - name: Record Windows host
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-verification | Out-Null
          Start-Transcript -Path .artifacts/windows-verification/host.log
          try {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
            $PSVersionTable | Format-Table
            bun --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "Source revision: $env:GITHUB_SHA"
            # Some runners start processes much slower than others; these lines show which kind this one is.
            Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
            "Memory GB: {0:N1}" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
            "TEMP: $env:TEMP"
            try {
              Get-MpComputerStatus | Select-Object AMRunningMode, RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled | Format-List
              "Defender excluded paths: " + ((Get-MpPreference).ExclusionPath -join '; ')
            } catch { "Defender status: unavailable ($($_.Exception.Message))" }
            $Clock = [Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt 20; $i++) { bun -e 0 }
            "20 Bun starts: {0:N0} ms" -f $Clock.Elapsed.TotalMilliseconds
          } finally { Stop-Transcript }
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck
        run: |
          bun run typecheck 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required native platform probe
        run: |
          bun tools/platform-report.ts 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/platform-report.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone compilation regressions
        run: |
          bun test tests/release-compile.test.ts 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/release-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release candidates without publishing
        run: |
          bun run build:release 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Screen of the built casper-windows-x64.exe (ConPTY)
        env:
          WINDOWS_SCREEN_BINARY: dist/release/casper-windows-x64.exe
        run: |
          bun test tests/windows-screen.test.ts 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/conpty-screen-exe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 installer
        shell: powershell
        run: |
          Start-Transcript -Path .artifacts/windows-verification/installer-powershell-5.log
          try {
            $PSVersionTable | Format-Table
            ./scripts/test-install-windows.ps1
            ./scripts/test-install-signature-windows.ps1
          } finally { Stop-Transcript }
      - name: PowerShell 7 installer
        shell: pwsh
        run: |
          Start-Transcript -Path .artifacts/windows-verification/installer-pwsh-7.log
          try {
            $PSVersionTable | Format-Table
            ./scripts/test-install-windows.ps1
            ./scripts/test-install-signature-windows.ps1
          } finally { Stop-Transcript }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-preview
          path: dist/release/
      - name: Upload verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification-build
          path: .artifacts/windows-verification/
          include-hidden-files: true
          if-no-files-found: warn

  # Source tmux/PTY/ConPTY users never share a worker with parallel regression files.
  terminal:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tier != 'fast' }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Turn off Defender's live scan for this run
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, "$env:USERPROFILE\.bun" -ErrorAction Stop
          } catch { "Defender unchanged: $($_.Exception.Message)" }
      - name: Install locked dependencies
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-verification | Out-Null
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Serial real-terminal lane (tmux, PTY and ConPTY, one retry per test)
        timeout-minutes: 15
        run: |
          bun run test:terminal 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/terminal.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload terminal evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification-terminal
          path: .artifacts/windows-verification/
          include-hidden-files: true
          if-no-files-found: warn

  # Greedy timing balance across six runners; terminals, real debugger and evals run separately.
  suite:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    # 18 minutes for the suite, 3 for the debugger, 6 for evals (the real-grader case alone takes 2-3 minutes on
    # Windows), plus install and evidence upload headroom.
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: pwsh
    env:
      TIER: ${{ needs.changes.outputs.tier || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Turn off Defender's live scan for this run
        # Windows CI runners scan every file the tests create; that alone makes the suite much slower.
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, "$env:USERPROFILE\.bun" -ErrorAction Stop
            "Defender live scan off for this run"
          } catch { "Defender unchanged: $($_.Exception.Message)" }
      - name: Install locked dependencies
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-verification | Out-Null
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression suite (whole or fast tier), part ${{ matrix.part }} of 6 (files in parallel)
        # Two file workers leave room for each test's Bun, git and language-server children.
        timeout-minutes: 18
        run: |
          $files = @(bun tools/test-shard.ts 6 ${{ matrix.part }} $env:TIER)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Part ${{ matrix.part }} ($env:TIER): $($files.Count) files"
          "Part ${{ matrix.part }}: $env:TIER tier, $($files.Count) files" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          bun test --parallel=2 --timings=tests/timings.json @files 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/full-suite-${{ matrix.part }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real debugger test (runs alone, as in bun run test)
        if: matrix.part == 3 && env.TIER == 'full'
        timeout-minutes: 3
        run: |
          bun test tests/phase10-debugger-real.test.ts 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/debugger-real.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Eval bench tests
        if: matrix.part == 1
        timeout-minutes: 6
        run: |
          bun run test:evals 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/evals.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification-suite-${{ matrix.part }}
          path: .artifacts/windows-verification/
          include-hidden-files: true
          if-no-files-found: warn
