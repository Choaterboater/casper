name: Windows preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tools/**', 'tests/**', 'evals/**', 'docs/WINDOWS.md', 'docs/PLATFORM_VERIFICATION.md', 'package.json', 'bun.lock', 'tsconfig.json', 'bunfig.toml', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/windows-preview.yml']
  # Every PR gets a Windows run too, so a change that breaks Windows is seen before it merges.
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tools/**', 'tests/**', 'evals/**', 'docs/WINDOWS.md', 'docs/PLATFORM_VERIFICATION.md', 'package.json', 'bun.lock', 'tsconfig.json', 'bunfig.toml', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/windows-preview.yml']
permissions:
  contents: read
# A newer push to the same branch or PR stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Record Windows host
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-verification | Out-Null
          Start-Transcript -Path .artifacts/windows-verification/host.log
          try {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
            $PSVersionTable | Format-Table
            bun --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "Source revision: $env:GITHUB_SHA"
          } finally { Stop-Transcript }
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck
        run: |
          bun run typecheck 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required native platform probe
        run: |
          bun tools/platform-report.ts 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/platform-report.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline platform and terminal contracts
        run: |
          bun test tests/platform-processes.test.ts tests/login-picker.test.ts tests/login.test.ts tests/model-routing.test.ts tests/auto-effort.test.ts tests/model-selection.test.ts tests/daily-terminal.test.ts tests/terminal-review.test.ts tests/terminal-ux.test.ts tests/terminal-discovery.test.ts tests/network-update-swap.test.ts tests/undo.test.ts tests/project-root-path.test.ts tests/login-browser.test.ts tests/receipt.test.ts tests/undo-app.integration.test.ts 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/source-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone compilation regressions
        run: |
          bun test tests/release-compile.test.ts 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/release-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release candidates without publishing
        run: |
          bun run build:release 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 installer
        shell: powershell
        run: |
          Start-Transcript -Path .artifacts/windows-verification/installer-powershell-5.log
          try {
            $PSVersionTable | Format-Table
            ./scripts/test-install-windows.ps1
          } finally { Stop-Transcript }
      - name: PowerShell 7 installer
        shell: pwsh
        run: |
          Start-Transcript -Path .artifacts/windows-verification/installer-pwsh-7.log
          try {
            $PSVersionTable | Format-Table
            ./scripts/test-install-windows.ps1
          } finally { Stop-Transcript }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-preview
          path: dist/release/
      - name: Full regression suite (files in parallel)
        # Reports for now: the full suite doesn't pass on Windows yet (docs/RELEASE.md, Known preview limits).
        # Install, startup and the focused tests above still block. Remove this line once it is green.
        continue-on-error: true
        run: |
          bun run test 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/full-suite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Eval bench tests
        # Reports for now: the full suite doesn't pass on Windows yet (docs/RELEASE.md, Known preview limits).
        # Install, startup and the focused tests above still block. Remove this line once it is green.
        continue-on-error: true
        run: |
          bun run test:evals 2>&1 | Tee-Object -FilePath .artifacts/windows-verification/evals.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification
          path: .artifacts/windows-verification/
          include-hidden-files: true
          if-no-files-found: warn
