name: macOS preview
# Pushes to main, the nightly run and manual runs test everything. A pull request runs the fast tier of the
# suite, and the heavy tier (real processes, the sandbox, the browser) too when it changes a path where OS
# behaviour matters (tools/test-tier.ts). Linux runs everything on every pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tools/**', 'tests/**', 'evals/**', 'docs/**', 'package.json', 'bun.lock', 'bunfig.toml', 'tsconfig.json', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/macos-preview.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['src/**', 'scripts/**', 'tools/**', 'tests/**', 'evals/**', 'docs/**', 'package.json', 'bun.lock', 'bunfig.toml', 'tsconfig.json', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/macos-preview.yml']
permissions:
  contents: read
# A newer push to a pull request stops the older run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Chooses the tier, typechecks, runs the sandbox and debugger tests, and the fast tier when that is the tier. A
  # whole-suite run also runs the suite in three parts and the browser test on its own machine, all at once (one
  # machine took about 18 minutes for them in a row, with the terminal job waiting behind it).
  source:
    # Draft PRs wait until "Ready for review"; pushes to main and manual runs always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    defaults:
      run:
        shell: bash
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit: HEAD^1 is main, so the diff is the PR's own change.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Choose the tests (whole suite, or the fast tier on a pull request that leaves OS behaviour alone)
        id: tier
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/macos-preview"
          if [ "$EVENT" = pull_request ]; then { git diff --no-renames --name-only HEAD^1 HEAD || true; } > "$RUNNER_TEMP/macos-preview/changed.txt"; else : > "$RUNNER_TEMP/macos-preview/changed.txt"; fi
          bun tools/test-tier.ts decide "$EVENT" < "$RUNNER_TEMP/macos-preview/changed.txt" > "$RUNNER_TEMP/macos-preview/tier.txt"
          tier="$(head -n 1 "$RUNNER_TEMP/macos-preview/tier.txt")"
          case "$tier" in full | fast) ;; *) echo "test-tier.ts printed no tier"; exit 1 ;; esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          { echo "## macOS"; tail -n +2 "$RUNNER_TEMP/macos-preview/tier.txt"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record host
        run: |
          mkdir -p "$RUNNER_TEMP/macos-preview"
          { printf 'Commit: %s\n' "$GITHUB_SHA"; sw_vers; uname -a; bun --version; ls -l /usr/bin/sandbox-exec; } 2>&1 | tee "$RUNNER_TEMP/macos-preview/host.log"
      - name: Install ripgrep and a second loopback address for the live sandbox tests
        # Pi's grep uses ripgrep (PI_OFFLINE: no download). The sandbox tests reach 127.0.0.2 as a host that is
        # not listed; macOS answers only 127.0.0.1 on lo0 until the alias is added.
        run: |
          brew install ripgrep
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up
          rg --version
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/macos-preview/install.log"
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck 2>&1 | tee "$RUNNER_TEMP/macos-preview/typecheck.log"
      - name: The shell sandbox on macOS (sandbox-exec)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tier.outputs.tier == 'full' }}
        timeout-minutes: 5
        run: bun test tests/sandbox-live.test.ts tests/sandbox-wiring.test.ts tests/sandbox-policy.test.ts 2>&1 | tee "$RUNNER_TEMP/macos-preview/sandbox.log"
      - name: Fast tier of the suite (files in parallel; a pull request that leaves OS behaviour alone)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tier.outputs.tier == 'fast' }}
        # The same guard as the full suite. The fast tier starts no real processes and takes about a minute.
        timeout-minutes: 10
        run: |
          files="$(bun tools/test-tier.ts fast)"
          echo "Fast tier: $(printf '%s\n' "$files" | wc -l | tr -d ' ') files"
          # shellcheck disable=SC2086 # one test file per word
          bash tools/stall-guard.sh "$RUNNER_TEMP/macos-preview/fast-suite.log" 180 "$RUNNER_TEMP/macos-preview/stall-dump.txt" -- bun test --parallel --timings=tests/timings.json $files
      - name: Real debugger test (runs alone, as in bun run test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tier.outputs.tier == 'full' }}
        timeout-minutes: 5
        run: bash tools/stall-guard.sh "$RUNNER_TEMP/macos-preview/debugger-real.log" 180 "$RUNNER_TEMP/macos-preview/stall-dump-debugger.txt" -- bun test tests/phase10-debugger-real.test.ts
      - name: Retain host verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-preview-evidence
          path: ${{ runner.temp }}/macos-preview/
          if-no-files-found: warn
          retention-days: 14

  # The whole suite in three parts of about equal time (tools/test-shard.ts, from tests/timings.json).
  suite:
    needs: source
    # Reuse the tier decision; a failed/missing decision fails open to full coverage, never a green skip.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.source.outputs.tier != 'fast' }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install ripgrep and a second loopback address for the live sandbox tests
        # Some suite files reach 127.0.0.2 and Pi's grep uses ripgrep, as in the source job.
        run: |
          mkdir -p "$RUNNER_TEMP/macos-preview"
          brew install ripgrep
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up
          rg --version
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/macos-preview/install.log"
      - name: Full regression suite, one part of three (files in parallel)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # The whole suite on one machine: 7.5 min p90 (max 7.9); a part is about a third of that.
        # tools/stall-guard.sh stops a run silent for 180 s and writes stall-dump.txt next to the log (every
        # process, each test worker's children, and a `sample` of where a worker on the CPU is stuck), then
        # runs the file(s) Bun was still running once more on their own (once per job). This is `bun run test`
        # with a separate terminal job; browser (which grew to 300 s under load) and debugger retain their own steps.
        timeout-minutes: 15
        run: bash tools/stall-guard.sh "$RUNNER_TEMP/macos-preview/full-suite.log" 180 "$RUNNER_TEMP/macos-preview/stall-dump.txt" -- bun run test:suite --shard="$PART"/3 --path-ignore-patterns='tests/phase10-browser.test.ts' --path-ignore-patterns='tests/phase10-browser-checks.test.ts'
      - name: Retain suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-preview-suite-${{ matrix.part }}
          path: ${{ runner.temp }}/macos-preview/
          if-no-files-found: warn
          retention-days: 14

  # The browser test alone on its own machine, beside the suite parts: under load it grew to 300 s.
  browser:
    needs: source
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.source.outputs.tier != 'fast' }}
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install locked dependencies
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/macos-preview"
          bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/macos-preview/install.log"
      - name: Browser test (runs alone, on its own machine)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 8
        run: bash tools/stall-guard.sh "$RUNNER_TEMP/macos-preview/browser.log" 180 "$RUNNER_TEMP/macos-preview/stall-dump-browser.txt" -- bun test tests/phase10-browser.test.ts
      # The browser test's second half (what a check says), split off when the file outgrew a 300 s run.
      - name: Browser checks test (runs alone, on its own machine)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 8
        run: bash tools/stall-guard.sh "$RUNNER_TEMP/macos-preview/browser-checks.log" 180 "$RUNNER_TEMP/macos-preview/stall-dump-browser-checks.txt" -- bun test tests/phase10-browser-checks.test.ts
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-preview-browser
          path: ${{ runner.temp }}/macos-preview/
          if-no-files-found: warn
          retention-days: 14

  terminal:
    needs: source
    # Reuse the tier decision; a failed/missing decision fails open to full coverage, never a green skip.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.source.outputs.tier != 'fast' }}
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Record host and install terminal prerequisites
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/macos-terminal"
          if ! command -v tmux || ! command -v rg; then brew install tmux ripgrep; fi
          { sw_vers; uname -a; bun --version; tmux -V; python3 -c 'import fcntl, pty, termios; print("POSIX PTY modules available")'; } 2>&1 | tee "$RUNNER_TEMP/macos-terminal/host.log"
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/macos-terminal/install.log"
      - name: Serial real-terminal lane (tmux and PTY, one retry per test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: bun run test:terminal 2>&1 | tee "$RUNNER_TEMP/macos-terminal/terminal.log"
      - name: Retain terminal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-terminal-evidence
          path: ${{ runner.temp }}/macos-terminal/
          if-no-files-found: warn
          retention-days: 14
