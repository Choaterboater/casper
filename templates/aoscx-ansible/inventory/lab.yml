---
# Lab switches only. The addresses are documentation examples (192.0.2.0/24): put your lab's here.
# Credentials come from your shell (AOSCX_USER, AOSCX_PASSWORD), never from this file.
all:
  children:
    aoscx:
      hosts:
        lab-cx-1:
          ansible_host: 192.0.2.11
        lab-cx-2:
          ansible_host: 192.0.2.12
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: arubanetworks.aoscx.aoscx
        ansible_user: "{{ lookup('env', 'AOSCX_USER') }}"
        ansible_password: "{{ lookup('env', 'AOSCX_PASSWORD') }}"
